name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build (default: the latest v* tag)'
        required: false
        default: ''
      draft:
        description: 'Publish the release as a draft'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - if: github.event_name == 'workflow_dispatch' && github.event.inputs.ref == ''
        name: Check out the latest release tag
        run: git checkout "$(git describe --tags --abbrev=0 --match 'v*')"
        shell: bash
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
      - if: runner.os != 'Linux'
        run: npm run smoke
      # electron-builder uploads the installers to the GitHub Release for this tag.
      - run: npm run package -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder publishes drafts by default; a manual run can ask for a public release.
          EP_DRAFT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'false' && 'false' || 'true' }}
